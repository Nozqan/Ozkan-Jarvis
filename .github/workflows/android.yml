name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Build Release APK
      run: |
        if [ -f "my-upload-key.jks" ] || [ ! -z "$KEYSTORE_PATH" ]; then
          ./gradlew assembleRelease
        else
          echo "Keystore not found, skipping release build to prevent failure."
          ./gradlew assembleDebug
        fi
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: app/build/outputs/apk/**/*.apk
